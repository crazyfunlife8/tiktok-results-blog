{{ define "main" }}
{{/* taxonomy.html — C站 分類索引頁（categories / tags 列表）
     同字體、同色調、同元件庫（SKILL §六 禁止項 7） */}}
<div class="cat-header">
  <div class="cat-header__inner">
    <nav class="breadcrumb" aria-label="breadcrumb">
      <a href="{{ .Site.BaseURL }}">首頁</a>
      <span>›</span>
      <span>{{ .Title }}</span>
    </nav>
    <h1 class="cat-header__title">{{ .Title }}</h1>
  </div>
</div>

<div class="cat-body">
  <ul class="post-list">
    {{ range .Pages }}
    <li class="post-card">
      <div class="post-card__date-block">
        <span class="post-card__date">{{ len .Pages }} 篇</span>
      </div>
      <div>
        <h2 class="post-card__title">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>
      </div>
    </li>
    {{ end }}
  </ul>
</div>

{{ end }}
