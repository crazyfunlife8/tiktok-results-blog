{{- /* budget-table shortcode: comparison table wrapper — §十二 */ -}}
{{- $title := .Get "title" -}}
{{- $sub := .Get "sub" -}}
<div class="budget-table-wrap">{{ with $title }}<div class="budget-table-head"><span class="budget-table-head-title">{{ . }}</span>{{ with $sub }}<span class="budget-table-head-sub">{{ . }}</span>{{ end }}</div>{{ end }}<div class="budget-table-inner">{{ .Inner | markdownify }}</div></div>
